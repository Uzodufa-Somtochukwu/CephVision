# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Public Firebase web config (identifiers only; access is enforced by security rules).
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAiVY8Z95fkveRrCicE7qncDlzfQIfWeeo"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "cephvision.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "cephvision"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "cephvision.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "533966520170"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:533966520170:web:ece71def2deef1853cef13"
    availability:
      - BUILD
      - RUNTIME

  # Server-only secrets. Create with: firebase apphosting:secrets:set <NAME>
  - variable: ROBOFLOW_API_KEY
    secret: ROBOFLOW_API_KEY
    availability:
      - RUNTIME
  - variable: ROBOFLOW_MODEL_ENDPOINT
    secret: ROBOFLOW_MODEL_ENDPOINT
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
